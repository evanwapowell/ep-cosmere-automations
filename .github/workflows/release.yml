# Build and attach module.json and module.zip to a GitHub release, either when a version tag (v1.2.3) is pushed
# (tools/release.sh) or when a release is published on GitHub's website (Releases → Draft a new release → a new
# tag like v0.3.0 on the branch to release). Runs the tests first. The zip has the files at its root, without what
# .gitattributes marks export-ignore.
# Foundry installs from https://github.com/evanwapowell/ep-cosmere-automations/releases/latest/download/module.json
name: Release

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test

      - name: Build module.json and module.zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          node - "$version" "$GITHUB_REPOSITORY" <<'JS'
          const fs = require('fs');
          const [version, repo] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          manifest.version = version;
          manifest.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
          manifest.download = `https://github.com/${repo}/releases/download/v${version}/module.zip`;
          fs.writeFileSync('module.json', JSON.stringify(manifest, null, 2) + '\n');
          JS
          mkdir dist
          git archive HEAD | tar -x -C dist
          cp module.json dist/module.json
          (cd dist && zip -r ../module.zip .)
          unzip -l module.zip

      - name: Publish the release (or add the files to the one just published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" module.zip module.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" module.zip module.json \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
